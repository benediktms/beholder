language: 'rust'
layer: 'application'

fileGroups:
  sources:
    - '.github/workflows/*.yml'
    - '.moon/*.yml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'Justfile'
    - 'crates/**/*.rs'
    - 'crates/**/Cargo.toml'
    - 'mise.toml'
    - 'moon.yml'
    - 'proto/**/*.proto'
    - 'rules/**/*.datalog'
    - 'rust-toolchain.toml'
    - 'scripts/**/*.sh'

tasks:
  check:
    command: 'cargo check --workspace'
    inputs:
      - '@group(sources)'

  test:
    command: 'cargo test --workspace'
    inputs:
      - '@group(sources)'

  lint:
    command: 'cargo clippy --workspace --all-targets --no-deps -- -D warnings'
    deps:
      - 'format-check'
    inputs:
      - '@group(sources)'

  format-check:
    command: 'cargo fmt --all -- --check'
    inputs:
      - '@group(sources)'

  format:
    command: 'cargo fmt --all'
    inputs:
      - '@group(sources)'
    options:
      cache: false
      runInCI: false

  release:
    command: 'cargo build --release -p beholder-cli -p beholder-daemon -p beholder-worker-rust'
    inputs:
      - '@group(sources)'
    options:
      cache: false
      runInCI: false

  release-all:
    command: 'true'
    deps:
      - 'release'
      - 'worker-elixir:release'
    toolchains: 'system'
    options:
      cache: false
      runInCI: false

  install:
    command: 'bash scripts/install.sh'
    deps:
      - 'release'
    inputs:
      - 'scripts/install.sh'
    options:
      cache: false
      runInCI: false

  uninstall:
    command: 'bash scripts/uninstall.sh'
    inputs:
      - 'scripts/uninstall.sh'
    options:
      cache: false
      runInCI: false

  smoke:
    command: 'bash scripts/dogfood.sh'
    inputs:
      - '@group(sources)'
      - 'scripts/dogfood.sh'
    options:
      cache: false

  db-plan:
    command: 'cargo run --quiet -p shell-mnestic --features devtools --bin mnestic-plan --'
    inputs:
      - '@group(sources)'
    options:
      cache: false
      runInCI: false

  index-bench:
    command: 'bash scripts/benchmark-indexing.sh'
    inputs:
      - '@group(sources)'
      - 'scripts/benchmark-indexing.sh'
    options:
      cache: false
      runInCI: false
