[workspace]
resolver = "3"
default-members = ["crates/cli"]
members = [
    "crates/cli",
    "crates/daemon",
    "crates/daemon-client",
    "crates/protocol",
    "crates/presentation",
    "crates/shell-mnestic",
    "crates/adapters-mnestic",
    "crates/adapters-graphql",
    "crates/adapters-protobuf",
    "crates/adapters-git",
    "crates/adapters-treesitter",
    "crates/adapters-treesitter-elixir",
    "crates/adapters-treesitter-rust",
    "crates/adapters-treesitter-csharp",
    "crates/adapters-treesitter-typescript",
    "crates/domain",
    "crates/dto",
    "crates/indexing",
    "crates/observability",
    "crates/plugin-sdk",
    "crates/worker-client",
    "crates/worker-rust",
    "crates/sqlite3-src",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
apalis = "=1.0.0-rc.9"
apalis-codec = "=0.1.0-rc.9"
apalis-sqlite = "=1.0.0-rc.8"
apollo-parser = "0.8.6"
beholder-adapters-graphql = { path = "crates/adapters-graphql" }
beholder-adapters-mnestic = { path = "crates/adapters-mnestic", default-features = false }
beholder-adapters-git = { path = "crates/adapters-git" }
beholder-adapters-protobuf = { path = "crates/adapters-protobuf" }
beholder-adapters-treesitter = { path = "crates/adapters-treesitter" }
beholder-adapters-treesitter-elixir = { path = "crates/adapters-treesitter-elixir" }
beholder-adapters-treesitter-rust = { path = "crates/adapters-treesitter-rust" }
beholder-adapters-treesitter-csharp = { path = "crates/adapters-treesitter-csharp" }
beholder-adapters-treesitter-typescript = { path = "crates/adapters-treesitter-typescript" }
beholder-domain = { path = "crates/domain" }
beholder-dto = { path = "crates/dto" }
beholder-indexing = { path = "crates/indexing" }
beholder-observability = { path = "crates/observability" }
beholder-plugin-sdk = { path = "crates/plugin-sdk" }
beholder-worker-client = { path = "crates/worker-client" }
beholder-worker-rust = { path = "crates/worker-rust" }
beholder-daemon-client = { path = "crates/daemon-client" }
beholder-protocol = { path = "crates/protocol" }
futures-util = "0.3.31"
log = "0.4.28"
opentelemetry = { version = "0.32.0", features = ["logs", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.32.0", features = ["logs", "trace"] }
rayon = "1.10.0"
salsa = "0.28.2"
quick-xml = "0.38.3"
reqwest = { version = "=0.13.1", default-features = false, features = ["blocking", "default-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "=0.8.6", default-features = false }
toml = "1.1.4"
tokio = "1.53.1"
tokio-stream = "0.1.17"
tonic = "0.14.6"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = "1.2.1"
jsonc-parser = { version = "0.33.1", features = ["serde"] }

[patch.crates-io]
sqlite3-src = { path = "crates/sqlite3-src" }
