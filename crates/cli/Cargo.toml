[package]
name = "beholder-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "beholder"
path = "src/main.rs"

[features]
default = ["sqlite"]
parallel = ["beholder-adapters-mnestic/parallel"]
sqlite = ["beholder-adapters-mnestic/sqlite"]

[dependencies]
beholder-adapters-mnestic.workspace = true
beholder-adapters-git.workspace = true
beholder-adapters-treesitter-rust.workspace = true
beholder-daemon-client.workspace = true
beholder-domain.workspace = true
beholder-dto.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
