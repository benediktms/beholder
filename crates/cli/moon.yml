language: 'rust'
layer: 'application'

dependsOn:
  - 'beholder-adapters-git'
  - 'beholder-adapters-mnestic'
  - 'beholder-adapters-treesitter-rust'
  - 'beholder-daemon-client'
  - 'beholder-domain'
  - 'beholder-dto'

workspace:
  inheritedTasks:
    include:
      - 'check'
      - 'test'
      - 'smoke'
      - 'lint'
      - 'format'

tasks:
  dogfood:
    command: 'bash scripts/dogfood.sh'
    inputs:
      - '/Cargo.lock'
      - '/Cargo.toml'
      - '/crates/**/*'
      - '/scripts/dogfood.sh'
    options:
      cache: false
      runFromWorkspaceRoot: true
