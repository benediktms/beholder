language: 'rust'
layer: 'library'

dependsOn:
  - 'beholder-domain'
  - 'beholder-dto'

fileGroups:
  sources:
    - 'Cargo.toml'
    - 'build.rs'
    - 'src/**/*.rs'
    - '/proto/**/*.proto'

workspace:
  inheritedTasks:
    include:
      - 'check'
      - 'test'
      - 'smoke'
      - 'lint'
      - 'format'
