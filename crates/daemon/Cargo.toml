[package]
name = "beholder-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "beholderd"
path = "src/main.rs"

[dependencies]
apalis.workspace = true
apalis-codec.workspace = true
apalis-sqlite.workspace = true
beholder-adapters-git.workspace = true
beholder-adapters-graphql.workspace = true
beholder-adapters-mnestic = { workspace = true, features = ["sqlite"] }
beholder-adapters-protobuf.workspace = true
beholder-adapters-treesitter-elixir.workspace = true
beholder-adapters-treesitter-rust.workspace = true
beholder-adapters-treesitter-csharp.workspace = true
beholder-adapters-treesitter-typescript.workspace = true
beholder-daemon-client.workspace = true
beholder-domain.workspace = true
beholder-dto.workspace = true
beholder-indexing.workspace = true
beholder-observability.workspace = true
beholder-protocol.workspace = true
beholder-worker-client.workspace = true
futures-util.workspace = true
notify = "8.2.0"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tracing = "0.1.44"
ulid.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
