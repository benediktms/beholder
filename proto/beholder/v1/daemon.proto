syntax = "proto3";

package beholder.v1;

service Daemon {
  rpc ClearCache(ClearCacheRequest) returns (ClearCacheResponse);
  rpc GarbageCollect(GarbageCollectRequest) returns (stream GarbageCollectEvent);
  rpc GetGarbageCollectionStatus(GetGarbageCollectionStatusRequest) returns (GetGarbageCollectionStatusResponse);
  rpc Context(EntityRequest) returns (ContextResponse);
  rpc DeleteRepository(DeleteRepositoryRequest) returns (DeleteRepositoryResponse);
  rpc Dependencies(TraversalEntityRequest) returns (DependenciesResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetRepository(GetRepositoryRequest) returns (RepositoryResponse);
  rpc GetWorkspaceGraphOverview(GetWorkspaceGraphOverviewRequest) returns (GetWorkspaceGraphOverviewResponse);
  rpc GetWorkspaceTopology(GetWorkspaceTopologyRequest) returns (GetWorkspaceTopologyResponse);
  rpc GetWorkspaceTopologyStatus(GetWorkspaceTopologyStatusRequest) returns (GetWorkspaceTopologyStatusResponse);
  rpc Impact(TraversalEntityRequest) returns (ImpactResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc SubmitIndex(SubmitIndexRequest) returns (SubmitIndexResponse);
  rpc SubmitEnrichment(SubmitEnrichmentRequest) returns (SubmitEnrichmentResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc RegisterWorkspace(RegisterWorkspaceRequest) returns (RegisterWorkspaceResponse);
  rpc SetWorkspacePlugin(SetWorkspacePluginRequest) returns (SetWorkspacePluginResponse);
  rpc RegisterRepository(RegisterRepositoryRequest) returns (RepositoryResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc StreamWorkspaceGraphNeighborhood(StreamWorkspaceGraphNeighborhoodRequest) returns (stream StreamWorkspaceGraphNeighborhoodResponse);
  rpc Trace(PathRequest) returns (TraceResponse);
  rpc Why(PathRequest) returns (WhyResponse);
}

message ClearCacheRequest {}

message ClearCacheResponse {}

message GarbageCollectRequest {}

message GarbageCollectEvent {
  oneof event {
    GarbageCollectProgress progress = 1;
    GarbageCollectResponse completed = 2;
  }
}

message GarbageCollectProgress {
  GarbageCollectPhase phase = 1;
  string step = 2;
  uint32 completed_steps = 3;
  uint32 total_steps = 4;
  optional uint64 rows = 5;
  optional uint64 completed_rows = 6;
  optional uint32 stale_states = 7;
  optional uint32 repositories = 8;
}

enum GarbageCollectPhase {
  GARBAGE_COLLECT_PHASE_UNSPECIFIED = 0;
  GARBAGE_COLLECT_PHASE_CLAIMING_OBSOLETE_STATES = 1;
  GARBAGE_COLLECT_PHASE_SWEEPING_OBSOLETE_STATES = 2;
  GARBAGE_COLLECT_PHASE_CHECKPOINTING_DATABASE = 3;
  GARBAGE_COLLECT_PHASE_RECLAIMING_DATABASE_SPACE = 4;
}

message GarbageCollectResponse {
  uint64 repository_states_queued = 1;
}

message GetGarbageCollectionStatusRequest {}

message GetGarbageCollectionStatusResponse {
  bool running = 1;
  uint64 repository_states_queued = 2;
  optional GarbageCollectProgress progress = 3;
  uint64 repository_states_collectible = 4;
  uint64 reclaimable_database_pages = 5;
}

message EntityRequest {
  string entity = 1;
  string workspace = 2;
}

message TraversalEntityRequest {
  string entity = 1;
  string workspace = 2;
  optional uint32 max_hops = 3;
}

message PathRequest {
  string from = 1;
  string to = 2;
  string workspace = 3;
  optional uint32 max_hops = 4;
}

message TraversalMetadata {
  uint32 max_hops = 1;
  bool truncated = 2;
}

message QueryMetadata {
  uint64 revision = 1;
  string view = 2;
  Freshness freshness = 3;
  AnalysisCompleteness completeness = 4;
  repeated AnalysisDiagnostic diagnostics = 5;
}

message GetWorkspaceTopologyRequest {
  string workspace = 1;
}

message GetWorkspaceTopologyResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  repeated Entity nodes = 3;
  repeated Edge edges = 4;
}

message GetWorkspaceTopologyStatusRequest {
  string workspace = 1;
}

message GetWorkspaceTopologyStatusResponse {
  QueryMetadata metadata = 1;
}

message GetWorkspaceGraphOverviewRequest {
  string workspace = 1;
}

message GetWorkspaceGraphOverviewResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  repeated GraphCommunity communities = 3;
  repeated GraphCommunityEdge edges = 4;
}

enum GraphCommunityKind {
  GRAPH_COMMUNITY_KIND_UNSPECIFIED = 0;
  GRAPH_COMMUNITY_KIND_REPOSITORY = 1;
  GRAPH_COMMUNITY_KIND_EXTERNAL = 2;
}

message GraphCommunity {
  string id = 1;
  GraphCommunityKind kind = 2;
  string name = 3;
  optional string repository = 4;
  uint64 entity_count = 5;
}

message GraphCommunityEdge {
  string id = 1;
  string from = 2;
  string to = 3;
  RelationKind kind = 4;
  uint64 count = 5;
}

message StreamWorkspaceGraphNeighborhoodRequest {
  string workspace = 1;
  oneof focus {
    string repository = 2;
    string entity = 3;
    bool external = 5;
  }
  optional uint32 max_edges = 4;
}

message GraphNeighborhoodFocus {
  oneof focus {
    string repository = 1;
    string entity = 2;
    bool external = 3;
  }
}

message StreamWorkspaceGraphNeighborhoodResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  GraphNeighborhoodFocus focus = 3;
  uint32 max_edges = 4;
  bool truncated = 5;
  repeated Entity nodes = 6;
  repeated Edge edges = 7;
  uint32 batch_index = 8;
  bool complete = 9;
}

message Freshness {
  bool stale = 1;
  bool indexing = 2;
  repeated string dirty_repositories = 3;
  repeated string enriching_repositories = 4;
}

enum AnalysisCompleteness {
  ANALYSIS_COMPLETENESS_UNSPECIFIED = 0;
  ANALYSIS_COMPLETENESS_COMPLETE = 1;
  ANALYSIS_COMPLETENESS_INCOMPLETE = 2;
}

enum AnalysisDiagnosticSeverity {
  ANALYSIS_DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  ANALYSIS_DIAGNOSTIC_SEVERITY_KNOWN_LIMITATION = 1;
  ANALYSIS_DIAGNOSTIC_SEVERITY_WARNING = 2;
}

message AnalysisDiagnostic {
  string code = 1;
  AnalysisDiagnosticSeverity severity = 2;
  string repository = 3;
  string path = 4;
  optional uint32 line = 5;
  optional string detail = 6;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_CALLABLE = 1;
  ENTITY_KIND_GRAPHQL_FIELD = 2;
  ENTITY_KIND_KAFKA_TOPIC = 3;
  ENTITY_KIND_NAMESPACE = 4;
  ENTITY_KIND_RPC = 5;
  ENTITY_KIND_SERVICE = 6;
  ENTITY_KIND_PROTO_ENUM = 7;
  ENTITY_KIND_PROTO_FIELD = 8;
  ENTITY_KIND_PROTO_FILE = 9;
  ENTITY_KIND_PROTO_MESSAGE = 10;
  ENTITY_KIND_PROTO_SERVICE = 11;
  ENTITY_KIND_UNITY_PREFAB = 12;
  ENTITY_KIND_GRAPHQL_OPERATION = 13;
  ENTITY_KIND_GRAPHQL_TYPE = 14;
  ENTITY_KIND_GRAPHQL_ARGUMENT = 15;
  ENTITY_KIND_GRAPHQL_ENUM_VALUE = 16;
}

enum GraphqlTypeKind {
  GRAPHQL_TYPE_KIND_UNSPECIFIED = 0;
  GRAPHQL_TYPE_KIND_ENUM = 1;
  GRAPHQL_TYPE_KIND_INPUT = 2;
  GRAPHQL_TYPE_KIND_INTERFACE = 3;
  GRAPHQL_TYPE_KIND_OBJECT = 4;
  GRAPHQL_TYPE_KIND_SCALAR = 5;
  GRAPHQL_TYPE_KIND_UNION = 6;
}

enum GraphqlOperationKind {
  GRAPHQL_OPERATION_KIND_UNSPECIFIED = 0;
  GRAPHQL_OPERATION_KIND_MUTATION = 1;
  GRAPHQL_OPERATION_KIND_QUERY = 2;
  GRAPHQL_OPERATION_KIND_SUBSCRIPTION = 3;
}

enum EntityOrigin {
  ENTITY_ORIGIN_UNSPECIFIED = 0;
  ENTITY_ORIGIN_SOURCE = 1;
  ENTITY_ORIGIN_GENERATED = 2;
  ENTITY_ORIGIN_EXTERNAL_DEPENDENCY = 3;
}

enum ProtoTypeKind {
  PROTO_TYPE_KIND_UNSPECIFIED = 0;
  PROTO_TYPE_KIND_ENUM = 1;
  PROTO_TYPE_KIND_MESSAGE = 2;
}

enum RpcCardinality {
  RPC_CARDINALITY_UNSPECIFIED = 0;
  RPC_CARDINALITY_UNARY = 1;
  RPC_CARDINALITY_CLIENT_STREAMING = 2;
  RPC_CARDINALITY_SERVER_STREAMING = 3;
  RPC_CARDINALITY_BIDIRECTIONAL_STREAMING = 4;
}

message EntityMetadata {
  oneof metadata {
    ProtoTypeKind proto_type_kind = 1;
    RpcCardinality rpc_cardinality = 2;
    GraphqlTypeKind graphql_type_kind = 3;
    GraphqlOperationKind graphql_operation_kind = 4;
  }
}

enum EvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_AST = 1;
  EVIDENCE_KIND_CONFIGURATION = 2;
  EVIDENCE_KIND_DESCRIPTOR = 3;
  EVIDENCE_KIND_GENERATED = 4;
  EVIDENCE_KIND_INFERENCE = 5;
  EVIDENCE_KIND_COMPILER = 6;
}

enum RelationKind {
  RELATION_KIND_UNSPECIFIED = 0;
  RELATION_KIND_BINDS_CONTRACT = 16;
  RELATION_KIND_CALLS = 1;
  RELATION_KIND_CALLS_RPC = 2;
  RELATION_KIND_CONSUMED_BY = 3;
  RELATION_KIND_DEFINES = 4;
  RELATION_KIND_IMPLEMENTED_BY = 5;
  RELATION_KIND_PUBLISHES = 6;
  RELATION_KIND_RESOLVED_BY = 7;
  RELATION_KIND_SELECTS = 8;
  RELATION_KIND_USES = 9;
  RELATION_KIND_FIELD_OF = 10;
  RELATION_KIND_REQUEST_TYPE = 11;
  RELATION_KIND_RESPONSE_TYPE = 12;
  RELATION_KIND_IMPORTS = 13;
  RELATION_KIND_REQUIRES = 14;
  RELATION_KIND_IMPLEMENTS = 15;
  RELATION_KIND_CALLS_GRAPHQL = 17;
}

message Entity {
  string id = 1;
  EntityKind kind = 2;
  string name = 3;
  optional string repository = 4;
  EntityOrigin origin = 5;
  bool test = 6;
  optional EntityMetadata metadata = 7;
}

message Evidence {
  EvidenceKind source = 1;
  optional string repository = 2;
  optional string path = 3;
  optional uint32 line = 4;
  optional string detail = 5;
}

message Edge {
  string id = 1;
  string from = 2;
  string to = 3;
  RelationKind kind = 4;
  float confidence = 5;
  repeated Evidence evidence = 6;
}

message SemanticPath {
  repeated string nodes = 1;
  repeated string edges = 2;
}

message EntityQuery {
  string entity = 1;
}

message SemanticPathQuery {
  string from = 1;
  string to = 2;
}

message ContextResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  EntityQuery query = 3;
  Entity root = 4;
  repeated Entity nodes = 5;
  repeated Edge edges = 6;
}

message Dependency {
  string entity = 1;
  uint32 hops = 2;
}

message DependenciesResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  EntityQuery query = 3;
  Entity root = 4;
  repeated Dependency dependencies = 5;
  repeated Entity nodes = 6;
  repeated Edge edges = 7;
  TraversalMetadata traversal = 8;
}

message Impact {
  string entity = 1;
  uint32 hops = 2;
}

message ImpactResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  EntityQuery query = 3;
  Entity root = 4;
  repeated Impact affected = 5;
  repeated Entity nodes = 6;
  repeated Edge edges = 7;
  TraversalMetadata traversal = 8;
}

message TraceResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  SemanticPathQuery query = 3;
  repeated Entity nodes = 4;
  repeated Edge edges = 5;
  repeated SemanticPath paths = 6;
  TraversalMetadata traversal = 7;
}

message WhyResponse {
  string schema = 1;
  QueryMetadata metadata = 2;
  SemanticPathQuery query = 3;
  repeated Entity nodes = 4;
  repeated Edge edges = 5;
  repeated SemanticPath paths = 6;
  TraversalMetadata traversal = 7;
}

message Workspace {
  string name = 1;
  repeated WorkspaceRepository repositories = 2;
  repeated ProtobufDescriptorSource protobuf_descriptors = 3;
  repeated string enabled_plugins = 4;
}

message ProtobufDescriptorSource {
  string repository = 1;
  string path = 2;
}

message WorkspaceRepository {
  string identity = 1;
  string display_name = 2;
  string base = 3;
  repeated string alternatives = 4;
}

message RegisterWorkspaceRequest {
  string name = 1;
  repeated string repository_paths = 2;
  repeated string protobuf_descriptor_paths = 3;
  repeated string enabled_plugins = 4;
}

message RegisterWorkspaceResponse {
  Workspace workspace = 1;
}

message SetWorkspacePluginRequest {
  string workspace = 1;
  string plugin = 2;
  bool enabled = 3;
}

message SetWorkspacePluginResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message RepositoryRevision {
  string source_state = 1;
  optional string head = 2;
  string analysis_identity = 3;
  bool incomplete = 4;
  repeated AnalysisDiagnostic diagnostics = 5;
}

message RepositoryStatus {
  WorkspaceRepository repository = 1;
  optional RepositoryRevision revision = 2;
  bool indexing = 3;
}

message RegisterRepositoryRequest {
  string path = 1;
}

message DeleteRepositoryRequest {
  string identity = 1;
}

message DeleteRepositoryResponse {
  uint64 repository_states_queued = 1;
}

message GetRepositoryRequest {
  string identity = 1;
}

message RepositoryResponse {
  RepositoryStatus repository = 1;
}

message StopRequest {}

message StopResponse {
  bool accepted = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  uint32 protocol_version = 2;
  uint32 pid = 3;
}

message ListJobsRequest {
  optional string page_token = 1;
}

message ListJobsResponse {
  repeated JobSummary jobs = 1;
  optional string next_page_token = 2;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message SubmitIndexRequest {
  oneof target {
    string workspace = 1;
    RepositoryIndexTarget repository = 2;
  }
}

message RepositoryIndexTarget {
  string repository = 1;
  optional string workspace_scope = 2;
}

message SubmitIndexResponse {
  JobSummary job = 1;
  repeated JobSummary overlapping_jobs = 2;
}

message SubmitEnrichmentRequest {
  string repository = 1;
  optional string workspace_scope = 2;
  repeated string worker_ids = 3;
}

enum EnrichmentSubmissionDisposition {
  ENRICHMENT_SUBMISSION_DISPOSITION_UNSPECIFIED = 0;
  ENRICHMENT_SUBMISSION_DISPOSITION_ENQUEUED = 1;
  ENRICHMENT_SUBMISSION_DISPOSITION_IN_PROGRESS = 2;
  ENRICHMENT_SUBMISSION_DISPOSITION_ALREADY_CURRENT = 3;
}

message EnrichmentSubmission {
  JobTarget target = 1;
  EnrichmentSubmissionDisposition disposition = 2;
  optional JobSummary job = 3;
}

message SubmitEnrichmentResponse {
  repeated EnrichmentSubmission results = 1;
  repeated JobSummary prerequisite_jobs = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_WAITING = 2;
  JOB_STATUS_RUNNING = 3;
  JOB_STATUS_COMPLETED = 4;
  JOB_STATUS_FAILED = 5;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_INDEX = 1;
  JOB_TYPE_ENRICHMENT = 2;
}

enum JobTrigger {
  JOB_TRIGGER_UNSPECIFIED = 0;
  JOB_TRIGGER_AUTOMATIC = 1;
  JOB_TRIGGER_MANUAL = 2;
}

message JobTarget {
  oneof target {
    string workspace = 1;
    string repository = 2;
  }
  optional string workspace_scope = 3;
  optional string worker_id = 4;
}

message JobSummary {
  string id = 1;
  JobStatus status = 2;
  JobType type = 3;
  JobTarget target = 4;
  JobTrigger trigger = 5;
  uint64 submitted_at_ms = 6;
}

enum JobWaitReason {
  JOB_WAIT_REASON_UNSPECIFIED = 0;
  JOB_WAIT_REASON_RETRY = 1;
  JOB_WAIT_REASON_PREREQUISITES = 2;
}

enum IndexJobOutcome {
  INDEX_JOB_OUTCOME_UNSPECIFIED = 0;
  INDEX_JOB_OUTCOME_PUBLISHED = 1;
  INDEX_JOB_OUTCOME_UNCHANGED = 2;
  INDEX_JOB_OUTCOME_SUPERSEDED = 3;
}

message IndexDestination {
  oneof destination {
    string workspace = 1;
    string standalone_repository = 2;
  }
}

message IndexDestinationResult {
  IndexDestination destination = 1;
  uint64 observation_count = 2;
  bool published = 3;
  IndexJobOutcome outcome = 4;
}

message IndexJobResult {
  repeated IndexDestinationResult destinations = 1;
}

enum EnrichmentJobOutcome {
  ENRICHMENT_JOB_OUTCOME_UNSPECIFIED = 0;
  ENRICHMENT_JOB_OUTCOME_PUBLISHED = 1;
  ENRICHMENT_JOB_OUTCOME_UNCHANGED = 2;
  ENRICHMENT_JOB_OUTCOME_ALREADY_CURRENT = 3;
  ENRICHMENT_JOB_OUTCOME_SUPERSEDED = 4;
}

message EnrichmentJobResult {
  JobTarget target = 1;
  string expected_worker_version = 2;
  EnrichmentJobOutcome outcome = 3;
  repeated string failed_prerequisite_job_ids = 4;
}

message Job {
  JobSummary summary = 1;
  uint32 attempts = 2;
  uint32 max_attempts = 3;
  optional uint64 run_at_ms = 4;
  optional uint64 started_at_ms = 5;
  optional uint64 completed_at_ms = 6;
  repeated string prerequisite_job_ids = 7;
  optional JobWaitReason wait_reason = 8;
  optional string last_error = 9;
  repeated string warnings = 10;
  optional IndexJobResult index_result = 11;
  optional EnrichmentJobResult enrichment_result = 12;
}
