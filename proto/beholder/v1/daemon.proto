syntax = "proto3";

package beholder.v1;

service Daemon {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc IndexRustWorkspace(IndexRustWorkspaceRequest) returns (IndexRustWorkspaceResponse);
  rpc Stop(StopRequest) returns (StopResponse);
}

message IndexRustWorkspaceRequest {
  repeated string repositories = 1;
}

message IndexRustWorkspaceResponse {
  uint64 observation_count = 1;
  bool published = 2;
}

message StopRequest {}

message StopResponse {
  bool accepted = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  uint32 protocol_version = 2;
  uint32 pid = 3;
}
